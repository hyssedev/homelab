global
    daemon
    user haproxy
    group haproxy
    chroot /var/lib/haproxy

    # Stdout logging
    log stdout format raw local0 info

    # Stats
    stats timeout 30s

    maxconn 100000

    # does not allow connections to leak on old HaProxy process when reloading
    hard-stop-after 1h

defaults
    mode    http
    log     global

    option http-keep-alive
    option abortonclose
    option dontlognull
    option httpchk
    
    # Timeouts
    timeout client          30s
    timeout server          30s
    timeout connect         5s
    timeout queue           5s
    timeout http-request    5s
    timeout http-keep-alive 2s
    timeout tunnel          1h

    retries 3

    default-server inter 3s fall 3 rise 2

frontend http_in
    bind *:80

    option httplog

    unique-id-format %[uuid(7)]
    http-request set-header X-Request-Id %[unique-id]
    http-request set-header X-Forwarded-Proto https
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-For %[src]

    # Headers capturing for logging
	capture request header Host len 64
    capture request header User-Agent len 200
    capture request header X-Forwarded-For len 64

    # Generic security headers available for all backends
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header Referrer-Policy strict-origin-when-cross-origin
    http-response set-header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()"

    # Drop unknown hosts
    acl known_host hdr(host) -i chrs.ro www.chrs.ro dashboard.chrs.ro
    http-request set-log-level silent   if !known_host
    http-request reject                 if !known_host

    # Drop empty User-Agent
    acl no_ua     req.hdr_cnt(User-Agent) eq 0
    acl empty_ua  req.hdr(User-Agent) -m len 0
    http-request set-log-level silent if no_ua or empty_ua
    http-request reject               if no_ua or empty_ua

    # Rate limiter, 429 if more than 100reqs/10s, and silent-drop if more than 20 4xx errors/10s
    # Also counts rate-limited 429s, so escalates and silents those
    stick-table type ip size 100k expire 1m store http_req_rate(10s),http_err_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }
    http-request silent-drop if { sc_http_err_rate(0) gt 20 }

    # Do not trust client-supplied identity headers, anti-spoofing
    http-request del-header Remote-User
    http-request del-header Remote-Name
    http-request del-header Remote-Email
    http-request del-header Remote-Groups
    http-request del-header Remote-Sub

    # Routing
    use_backend chrs.ro if { hdr(host) -i chrs.ro www.chrs.ro }
    use_backend dynacat if { hdr(host) -i dashboard.chrs.ro }

backend chrs.ro
    option httpchk GET /health
    http-check expect status 200

    # Caching handled app-level by SWS
    
    server chrs chrs.ro:80 check

backend dynacat
    option httpchk GET /api/healthz
    http-check expect status 200

    server dynacat dynacat:8080 check

# Stats and metrics
listen stats
    bind 127.0.0.1:8404
    no log

    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-modules
    stats admin if LOCALHOST

frontend metrics
    bind 127.0.0.1:8405
    mode http
    http-request use-service prometheus-exporter if { path /metrics }
    no log
