global
    daemon
    user haproxy
    group haproxy

    # Stdout logging
    log stdout format raw local0 info

    # Native ACME (experimental)
    expose-experimental-directives
    stats socket /certs/admin.sock mode 660 level admin
    stats timeout 30s

    maxconn 100000

    # does not allow connections to leak on old HaProxy process when reloading
    hard-stop-after 1h

    # tell HAProxy to use system CA certificates
    httpclient.ssl.ca-file @system-ca

    # Forward-auth support for Tinyauth
    tune.lua.bool-sample-conversion normal
    lua-prepend-path /usr/local/etc/haproxy/lua/json/?.lua
    lua-prepend-path /usr/local/etc/haproxy/lua/http/?.lua
    lua-load /usr/local/etc/haproxy/lua/auth-request/auth-request.lua

    # TLS defaults
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

acme LE
    directory https://acme-v02.api.letsencrypt.org/directory
    contact me@chrs.ro
    account-key /certs/LE.account.key
    challenge http-01
    map virt@acme

crt-store
    crt-base /certs
    key-base /certs
    load crt "chrs.ro.pem" acme LE domains "chrs.ro,www.chrs.ro,dashboard.chrs.ro,auth.chrs.ro,docker.chrs.ro,status.chrs.ro"

defaults
    mode    http
    log     global

    option http-keep-alive
    option abortonclose
    option dontlognull
    option httpchk

    # Timeouts
    timeout client          30s
    timeout server          30s
    timeout connect         5s
    timeout queue           5s
    timeout http-request    5s
    timeout http-keep-alive 2s
    timeout tunnel          1h

    retries 3

    default-server inter 3s fall 3 rise 2

frontend http_in
    bind *:80

    option httplog

    # serve native ACME http-01 tokens before redirecting normal traffic
    http-request return status 200 content-type text/plain lf-string "%[path,field(-1,/)].%[path,field(-1,/),map(virt@acme)]\n" if { path_beg '/.well-known/acme-challenge/' }

    # http -> https redirect
    http-request redirect scheme https code 301

frontend https_in
    bind *:443 ssl strict-sni alpn h2,http/1.1 crt "chrs.ro.pem"

    option httplog

    unique-id-format %[uuid(7)]
    http-request set-header X-Request-Id %[unique-id]
    http-request set-header X-Forwarded-Proto https
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-For %[src]

    # Headers capturing for logging
	capture request header Host len 64
    capture request header User-Agent len 200
    capture request header X-Forwarded-For len 64

    # Generic security headers available for all backends
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header Referrer-Policy strict-origin-when-cross-origin
    http-response set-header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()"

    # Drop unknown hosts
    acl known_host hdr(host) -i chrs.ro www.chrs.ro dashboard.chrs.ro auth.chrs.ro docker.chrs.ro status.chrs.ro
    http-request set-log-level silent   if !known_host
    http-request reject                 if !known_host

    # Drop empty User-Agent
    acl no_ua     req.hdr_cnt(User-Agent) eq 0
    acl empty_ua  req.hdr(User-Agent) -m len 0
    http-request set-log-level silent if no_ua or empty_ua
    http-request reject               if no_ua or empty_ua

    # Rate limiter, 429 if more than 100reqs/10s, and silent-drop if more than 20 4xx errors/10s
    # Also counts rate-limited 429s, so escalates and silents those
    stick-table type ip size 100k expire 1m store http_req_rate(10s),http_err_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }
    http-request silent-drop if { sc_http_err_rate(0) gt 20 }

    # Do not trust client-supplied identity headers, anti-spoofing
    http-request del-header Remote-User
    http-request del-header Remote-Name
    http-request del-header Remote-Email
    http-request del-header Remote-Groups
    http-request del-header Remote-Sub

    # auth
    acl protected hdr(host) -i dashboard.chrs.ro docker.chrs.ro
    http-request set-header X-Forwarded-Host %[req.hdr(host)] if protected
    http-request set-header X-Forwarded-Uri  %[pathq]         if protected
    http-request lua.auth-request tinyauth /api/auth/nginx if protected
    http-request redirect location %[var(req.auth_response_header.x_tinyauth_location)] code 302 if protected !{ var(txn.auth_response_successful) -m bool } { var(req.auth_response_header.x_tinyauth_location) -m found }
    http-request deny deny_status 503 if protected !{ var(txn.auth_response_successful) -m bool }

    http-request set-header Remote-User   %[var(req.auth_response_header.remote_user)]   if protected { var(txn.auth_response_successful) -m bool } { var(req.auth_response_header.remote_user) -m found }
    http-request set-header Remote-Name   %[var(req.auth_response_header.remote_name)]   if protected { var(txn.auth_response_successful) -m bool } { var(req.auth_response_header.remote_name) -m found }
    http-request set-header Remote-Email  %[var(req.auth_response_header.remote_email)]  if protected { var(txn.auth_response_successful) -m bool } { var(req.auth_response_header.remote_email) -m found }
    http-request set-header Remote-Groups %[var(req.auth_response_header.remote_groups)] if protected { var(txn.auth_response_successful) -m bool } { var(req.auth_response_header.remote_groups) -m found }
    http-request set-header Remote-Sub    %[var(req.auth_response_header.remote_sub)]    if protected { var(txn.auth_response_successful) -m bool } { var(req.auth_response_header.remote_sub) -m found }

    # preserve Tinyauth's sliding session refresh
    http-request set-var(txn.auth_set_cookie) var(req.auth_response_header.set_cookie) if protected { var(req.auth_response_header.set_cookie) -m found }
    http-response add-header Set-Cookie %[var(txn.auth_set_cookie)] if { var(txn.auth_set_cookie) -m found }

    # Routing
    use_backend chrs.ro if { hdr(host) -i chrs.ro www.chrs.ro }
    use_backend dynacat if { hdr(host) -i dashboard.chrs.ro }
    use_backend tinyauth if { hdr(host) -i auth.chrs.ro }
    use_backend dockhand if { hdr(host) -i docker.chrs.ro }
    use_backend kener if { hdr(host) -i status.chrs.ro }

backend chrs.ro
    option httpchk GET /health
    http-check expect status 200

    # Caching handled app-level by SWS

    # Strict security headers for static
    http-response set-header X-Frame-Options DENY
    http-response set-header Cross-Origin-Opener-Policy same-origin
    http-response set-header Cross-Origin-Resource-Policy same-origin
    http-response set-header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';"

    server chrs chrs:80 check

backend dynacat
    option httpchk GET /api/healthz
    http-check expect status 200

    server dynacat dynacat:8080 check

backend tinyauth
    option httpchk GET /api/healthz
    http-check expect status 200

    server tinyauth tinyauth:3000 check

backend dockhand
    # option httpchk GET /api/health
    # http-check expect status 200

    server dockhand dockhand:3000

backend kener
    # option httpchk GET /healthcheck?strict=1
    # http-check expect status 200

    server kener kener:3000

# Stats and metrics
listen stats
    bind 127.0.0.1:8404
    no log

    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-modules
    stats admin if LOCALHOST

frontend metrics
    bind 127.0.0.1:8405
    mode http
    http-request use-service prometheus-exporter if { path /metrics }
    no log
