services:
  dynacat:
    container_name: dynacat
    image: panonim/dynacat:2.4.0
    restart: unless-stopped
    networks:
      - reverse-proxy
    volumes:
      - ./config:/app/config
      - ./assets:/app/assets
      - /etc/localtime:/etc/localtime:ro

networks:
  reverse-proxy:
    external: true