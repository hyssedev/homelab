pages:
  - name: Home
    # Optionally, if you only have a single page you can hide the desktop navigation for a cleaner look
    # hide-desktop-navigation: true
    hide-from-navigation: true
    columns:
      - size: small
        widgets:
          - type: server-stats
            servers:
              - type: local
                name: vps
                compact: true
                hide-swap: true
          
          - type: speedtest

          - type: rss
            limit: 10
            collapse-after: 5
            cache: 12h
            feeds:
              - url: https://selfh.st/rss/
                title: selfh.st
                limit: 4
              - url: https://samwho.dev/rss.xml

      - size: full
        widgets:
          - type: group
            widgets:
              - type: hacker-news
                # collapse-after: 6
              - type: lobsters
                # collapse-after: 6

          - type: videos
            channels:
              - UCXuqSBlHAE6Xw-yeJA0Tunw # Linus Tech Tips
              - UCR-DXc1voovS8nhAvccRZhg # Jeff Geerling
              - UCsBjURrPoezykLs9EqgamOA # Fireship
              - UCBJycsmduvYEL83R_U4JriQ # Marques Brownlee
              - UCHnyfMqiRRG1u-2MsSQLbXA # Veritasium
              - UCUyeluBRhGPCW4rPe_UvBZQ # ThePrimeAgen
              - UChk6TQce1EJMn6_liKdHDog # ThePrimeAgenHighlights

      - size: small
        widgets:
          - type: clock
            hour-format: 24h

          - type: calendar
            first-day-of-week: monday
          
          - type: weather
            location: Bucharest, Romania
            units: metric # alternatively "imperial"
            hour-format: 24h # alternatively "24h"
            # Optionally hide the location from being displayed in the widget
            # hide-location: true

  - name: Startpage
    slug: start
    width: slim
    hide-desktop-navigation: true
    center-vertically: true
    hide-from-navigation: true
    columns:
      - size: full
        widgets:
          - type: search
            autofocus: true

          # - type: monitor
          #   cache: 1m
          #   title: Services
          #   sites:
          #     - title: Jellyfin
          #       url: https://yourdomain.com/
          #       icon: si:jellyfin
          #     - title: Gitea
          #       url: https://yourdomain.com/
          #       icon: si:gitea
          #     - title: qBittorrent # only for Linux ISOs, of course
          #       url: https://yourdomain.com/
          #       icon: si:qbittorrent
          #     - title: Immich
          #       url: https://yourdomain.com/
          #       icon: si:immich
          #     - title: AdGuard Home
          #       url: https://yourdomain.com/
          #       icon: si:adguard
          #     - title: Vaultwarden
          #       url: https://yourdomain.com/
          #       icon: si:vaultwarden

          - type: bookmarks
            groups:
              - title: General
                links:
                  - title: Gmail
                    url: https://mail.google.com/mail/u/0/
                  - title: Amazon
                    url: https://www.amazon.com/
                  - title: Github
                    url: https://github.com/
              - title: Entertainment
                links:
                  - title: YouTube
                    url: https://www.youtube.com/
                  - title: Prime Video
                    url: https://www.primevideo.com/
                  - title: Disney+
                    url: https://www.disneyplus.com/
              - title: Social
                links:
                  - title: Reddit
                    url: https://www.reddit.com/
                  - title: Twitter
                    url: https://twitter.com/
                  - title: Instagram
                    url: https://www.instagram.com/

branding:
