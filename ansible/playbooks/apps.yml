---
- name: Deploy app stacks
  hosts: vps
  gather_facts: false
  become: true
  vars:
    stacks_src: "{{ playbook_dir }}/../../stacks"
    stacks_dest: /opt/stacks
    stacks:
      - tinyauth
      - dynacat
      - chrs.ro
      - dockhand
      - kener
      - prometheus
      - grafana
      - cloudflared
      - haproxy
    grafana_dashboards:
      - name: haproxy
        id: 12693
        revision: 14
        datasource_input: DS_PROMETHEUS
        datasource_uid: prometheus
      - name: node-exporter-full
        id: 1860
        revision: 45
        datasource_input: ds_prometheus
        datasource_uid: prometheus
      - name: cadvisor
        id: 14282
        revision: 1
        datasource_input: DS_PROMETHEUS
        datasource_uid: prometheus
      - name: cloudflared
        id: 17457
        revision: 6
        datasource_input: DS_PROMETHEUS
        datasource_uid: prometheus
  tasks:
    - name: Require deployment secrets
      ansible.builtin.assert:
        that:
          - cloudflare_tunnel_id | default('') | length > 0
          - cloudflare_tunnel_credentials | default('') | length > 0
          - (cloudflare_tunnel_credentials | from_json).TunnelID == cloudflare_tunnel_id
          - tinyauth_users | default('') | length > 0
          - kener_secret_key | default('') | length >= 32
        fail_msg: >-
          Set valid cloudflare_tunnel_id, cloudflare_tunnel_credentials,
          tinyauth_users, and kener_secret_key values, preferably in an
          Ansible Vault encrypted variable file. The Cloudflare credentials
          must belong to the configured tunnel, and the Kener secret must be
          at least 32 characters.

    - name: Sync stack files
      ansible.posix.synchronize:
        src: "{{ stacks_src }}/"
        dest: "{{ stacks_dest }}/"
        archive: true
        owner: false
        group: false
        rsync_path: sudo -n rsync
        rsync_opts:
          - "--exclude=*.backup"
          - "--exclude=/cloudflared/credentials/*"
          - "--exclude=/tinyauth/data/*"
          - "--exclude=/tinyauth/secrets/*"
          - "--exclude=/dockhand/data/*"
          - "--exclude=/kener/database/*"
          - "--exclude=/kener/redis/*"
          - "--exclude=/kener/secrets/*"
          - "--exclude=/grafana/data/*"
          - "--exclude=/grafana/dashboards/*"
          - "--exclude=/prometheus/data/*"

    - name: Install Cloudflare Tunnel credentials
      ansible.builtin.copy:
        content: "{{ cloudflare_tunnel_credentials }}\n"
        dest: "{{ stacks_dest }}/cloudflared/credentials/tunnel.json"
        owner: root
        group: "65532"
        mode: "0440"
      no_log: true

    - name: Install Tinyauth users secret
      ansible.builtin.copy:
        content: "{{ tinyauth_users }}\n"
        dest: "{{ stacks_dest }}/tinyauth/secrets/users"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Install Kener secret environment
      ansible.builtin.copy:
        content: |
          KENER_SECRET_KEY={{ kener_secret_key }}
        dest: "{{ stacks_dest }}/kener/secrets/kener.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Set Kener database ownership
      ansible.builtin.file:
        path: "{{ stacks_dest }}/kener/database"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0750"
        recurse: true

    - name: Set Grafana data ownership
      ansible.builtin.file:
        path: "{{ stacks_dest }}/grafana/data"
        state: directory
        owner: "472"
        group: "0"
        mode: "0750"

    - name: Fetch Grafana dashboards
      ansible.builtin.uri:
        url: >-
          https://grafana.com/api/dashboards/{{ item.id }}/revisions/{{ item.revision }}/download
        return_content: true
      loop: "{{ grafana_dashboards }}"
      loop_control:
        label: "{{ item.name }} revision {{ item.revision }}"
      delegate_to: localhost
      become: false
      register: grafana_dashboard_downloads

    - name: Install Grafana dashboards
      ansible.builtin.copy:
        content: >-
          {{ item.content
             | replace(
                 '${' ~ item.item.datasource_input ~ '}',
                 item.item.datasource_uid
               ) }}
        dest: "{{ stacks_dest }}/grafana/dashboards/{{ item.item.name }}.json"
        owner: root
        group: "0"
        mode: "0640"
      loop: "{{ grafana_dashboard_downloads.results }}"
      loop_control:
        label: "{{ item.item.name }} revision {{ item.item.revision }}"

    - name: Set Prometheus data ownership
      ansible.builtin.file:
        path: "{{ stacks_dest }}/prometheus/data"
        state: directory
        owner: "65534"
        group: "65534"
        mode: "0750"

    - name: Create shared Docker networks
      community.docker.docker_network:
        name: "{{ item }}"
      loop:
        - reverse-proxy
        - cloudflare-tunnel
        - monitoring

    - name: Bring stacks up
      community.docker.docker_compose_v2:
        project_src: "{{ stacks_dest }}/{{ item }}"
        state: present
        remove_orphans: true
      loop: "{{ stacks }}"
