---
- name: Deploy app stacks
  hosts: vps
  gather_facts: false
  become: true
  vars:
    stacks_src: "{{ playbook_dir }}/../../stacks"
    stacks_dest: /opt/stacks
    stacks:
      - tinyauth
      - dynacat
      - chrs.ro
      - dockhand
      - kener
      - haproxy
  tasks:
    - name: Sync stack files
      ansible.builtin.copy:
        src: "{{ stacks_src }}/{{ item }}/"
        dest: "{{ stacks_dest }}/{{ item }}/"
      loop: "{{ stacks }}"

    - name: Require Tinyauth users
      ansible.builtin.assert:
        that:
          - (tinyauth_users | default('') | length) > 0
        fail_msg: >-
          Set tinyauth_users to a Tinyauth username:bcrypt-hash record,
          preferably in an Ansible Vault encrypted variable file.

    - name: Install Tinyauth users secret
      ansible.builtin.copy:
        content: "{{ tinyauth_users }}\n"
        dest: "{{ stacks_dest }}/tinyauth/secrets/users"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Require Kener secret key
      ansible.builtin.assert:
        that:
          - (kener_secret_key | default('') | length) >= 32
        fail_msg: >-
          Set kener_secret_key to a random value of at least 32 characters,
          preferably in an Ansible Vault encrypted variable file.

    - name: Install Kener secret environment
      ansible.builtin.copy:
        content: |
          KENER_SECRET_KEY={{ kener_secret_key }}
        dest: "{{ stacks_dest }}/kener/secrets/kener.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Set Kener database ownership
      ansible.builtin.file:
        path: "{{ stacks_dest }}/kener/database"
        state: directory
        owner: "1000"
        group: "1000"
        recurse: true

    - name: Create reverse proxy network
      community.docker.docker_network:
        name: reverse-proxy

    - name: Bring stacks up
      community.docker.docker_compose_v2:
        project_src: "{{ stacks_dest }}/{{ item }}"
        state: present
        remove_orphans: true
      loop: "{{ stacks }}"

    - name: Schedule daily HAProxy cert dump to disk
      ansible.builtin.cron:
        name: haproxy-dump-certs
        hour: "4"
        minute: "17"
        job: >-
          bash /opt/stacks/haproxy/scripts/haproxy-dump-certs.sh
          -s /opt/stacks/haproxy/certs/admin.sock
          -p /opt/stacks/haproxy/certs
