---
- name: Deploy app stacks
  hosts: vps
  gather_facts: false
  become: true
  vars:
    stacks_src: "{{ playbook_dir }}/../../stacks"
    stacks_dest: /opt/stacks
    stacks:
      - tinyauth
      - dynacat
      - chrs.ro
      - dockhand
      - kener
      - prometheus
      - grafana
      - cloudflared
      - haproxy
    grafana_dashboards:
      - name: haproxy
        id: 12693
        revision: 14
        datasource_input: DS_PROMETHEUS
        datasource_uid: prometheus
      - name: node-exporter-full
        id: 1860
        revision: 45
        datasource_input: ds_prometheus
        datasource_uid: prometheus
      - name: cadvisor
        id: 14282
        revision: 1
        datasource_input: DS_PROMETHEUS
        datasource_uid: prometheus
      - name: cloudflared
        id: 17457
        revision: 6
        datasource_input: DS_PROMETHEUS
        datasource_uid: prometheus
  tasks:
    - name: Sync stack files
      ansible.builtin.copy:
        src: "{{ stacks_src }}/{{ item }}/"
        dest: "{{ stacks_dest }}/{{ item }}/"
      loop: "{{ stacks }}"

    - name: Require Cloudflare Tunnel credentials
      ansible.builtin.assert:
        that:
          - cloudflare_tunnel_id | default('') | length > 0
          - cloudflare_tunnel_credentials | default('') | length > 0
          - (cloudflare_tunnel_credentials | from_json).TunnelID == cloudflare_tunnel_id
        fail_msg: >-
          Set cloudflare_tunnel_id and cloudflare_tunnel_credentials.
          The credentials must belong to the configured tunnel.
      no_log: true

    - name: Create Cloudflare Tunnel credentials directory
      ansible.builtin.file:
        path: "{{ stacks_dest }}/cloudflared/credentials"
        state: directory
        owner: root
        group: "65532"
        mode: "0750"

    - name: Install Cloudflare Tunnel credentials
      ansible.builtin.copy:
        content: "{{ cloudflare_tunnel_credentials }}\n"
        dest: "{{ stacks_dest }}/cloudflared/credentials/tunnel.json"
        owner: root
        group: "65532"
        mode: "0440"
      no_log: true

    - name: Require Tinyauth users
      ansible.builtin.assert:
        that:
          - (tinyauth_users | default('') | length) > 0
        fail_msg: >-
          Set tinyauth_users to a Tinyauth username:bcrypt-hash record,
          preferably in an Ansible Vault encrypted variable file.

    - name: Install Tinyauth users secret
      ansible.builtin.copy:
        content: "{{ tinyauth_users }}\n"
        dest: "{{ stacks_dest }}/tinyauth/secrets/users"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Require Kener secret key
      ansible.builtin.assert:
        that:
          - (kener_secret_key | default('') | length) >= 32
        fail_msg: >-
          Set kener_secret_key to a random value of at least 32 characters,
          preferably in an Ansible Vault encrypted variable file.

    - name: Install Kener secret environment
      ansible.builtin.copy:
        content: |
          KENER_SECRET_KEY={{ kener_secret_key }}
        dest: "{{ stacks_dest }}/kener/secrets/kener.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Set Kener database ownership
      ansible.builtin.file:
        path: "{{ stacks_dest }}/kener/database"
        state: directory
        owner: "1000"
        group: "1000"

    - name: Set Grafana data ownership
      ansible.builtin.file:
        path: "{{ stacks_dest }}/grafana/data"
        state: directory
        owner: "472"
        group: "0"
        mode: "0750"

    - name: Create Grafana dashboard directories
      ansible.builtin.file:
        path: "{{ stacks_dest }}/grafana/dashboards"
        state: directory
        owner: root
        group: "0"
        mode: "0750"

    - name: Fetch Grafana dashboards
      ansible.builtin.uri:
        url: >-
          https://grafana.com/api/dashboards/{{ item.id }}/revisions/{{ item.revision }}/download
        return_content: true
      loop: "{{ grafana_dashboards }}"
      loop_control:
        label: "{{ item.name }} revision {{ item.revision }}"
      delegate_to: localhost
      become: false
      register: grafana_dashboard_downloads

    - name: Install Grafana dashboards
      ansible.builtin.copy:
        content: >-
          {{ item.content
             | replace(
                 '${' ~ item.item.datasource_input ~ '}',
                 item.item.datasource_uid
               ) }}
        dest: "{{ stacks_dest }}/grafana/dashboards/{{ item.item.name }}.json"
        owner: root
        group: "0"
        mode: "0640"
      loop: "{{ grafana_dashboard_downloads.results }}"
      loop_control:
        label: "{{ item.item.name }} revision {{ item.item.revision }}"

    - name: Set Prometheus data ownership
      ansible.builtin.file:
        path: "{{ stacks_dest }}/prometheus/data"
        state: directory
        owner: "65534"
        group: "65534"
        mode: "0750"

    - name: Create reverse proxy network
      community.docker.docker_network:
        name: reverse-proxy

    - name: Create Cloudflare Tunnel network
      community.docker.docker_network:
        name: cloudflare-tunnel

    - name: Create monitoring network
      community.docker.docker_network:
        name: monitoring

    - name: Bring stacks up
      community.docker.docker_compose_v2:
        project_src: "{{ stacks_dest }}/{{ item }}"
        state: present
        remove_orphans: true
      loop: "{{ stacks }}"
