---
name: Ansible

on:
  push:
    branches:
      - main
    paths:
      - "ansible/**"
      - ".github/workflows/ansible.yml"
  pull_request:
    branches:
      - main
    paths:
      - "ansible/**"
      - ".github/workflows/ansible.yml"

concurrency:
  group: ansible-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax-check:
    name: Syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ansible

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ansible/requirements.txt

      - name: Install Ansible
        run: pip install --requirement requirements.txt

      - name: Cache Ansible collections
        id: collections-cache
        uses: actions/cache@v4
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ runner.os }}-${{ hashFiles('ansible/requirements.yml') }}

      - name: Install Ansible collections
        if: steps.collections-cache.outputs.cache-hit != 'true'
        run: ansible-galaxy collection install --requirements-file requirements.yml

      - name: Create CI inventory
        run: cp inventory/hosts.example.yml inventory/hosts.yml

      - name: Check playbook syntax
        run: |
          for playbook in playbooks/*.yml; do
            ansible-playbook --syntax-check "$playbook"
          done
